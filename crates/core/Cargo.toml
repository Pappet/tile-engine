[package]
name = "tile_core"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = { version = "0.14.2", features = ["serialize"] }
bevy_app = "0.14.2"
serde = { version = "1.0", features = ["derive"] }
bitflags = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
serde-big-array = "0.5.1"

[dev-dependencies]
bincode = "1.3.3"
proptest = "1.5"
serde_json = "1"
